name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # GITHUB_TOKEN merges do not trigger push workflows. Reconcile them without
  # adding a personal token or another GitHub App. Avoid the busy top of hour.
  schedule:
    - cron: '17 * * * *'

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  maintenance:
    name: Check maintenance release PR
    needs: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Queue checked patch release auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: release-please--branches--main--components--roast
        run: |
          set -euo pipefail
          release_fields='number,title,author,baseRefName,headRefName,headRefOid,isCrossRepository,files,labels,autoMergeRequest'
          pr="$(gh pr list --base main --head "${RELEASE_BRANCH}" --state open \
            --json "${release_fields}" \
            --jq '.[0] // empty')"
          if [[ -z "${pr}" ]]; then
            exit 0
          fi
          number="$(jq -r '.number' <<<"${pr}")"
          # A main-branch chore can leave release files unchanged, so Release
          # Please may not refresh its PR. Strict protection still requires the
          # latest main. The native updater checks commit ancestry itself and
          # does nothing when current; do not rely on PR merge-state metadata.
          # Refresh only this repository's recognized bot branch, then reread
          # its metadata before eligibility/CI checks.
          if jq -e '.isCrossRepository == false and .author.is_bot == true
            and (.author.login == "app/github-actions" or .author.login == "github-actions[bot]")' <<<"${pr}"; then
            gh pr update-branch "${number}"
            pr="$(gh pr view "${number}" --json "${release_fields}")"
          fi
          head="$(jq -r '.headRefOid' <<<"${pr}")"
          base_version="$(gh api "repos/${GH_REPO}/contents/.release-please-manifest.json?ref=main" \
            --jq '.content | @base64d | fromjson | .["."]')"
          next_version="$(gh api "repos/${GH_REPO}/contents/.release-please-manifest.json?ref=${head}" \
            --jq '.content | @base64d | fromjson | .["."]')"
          if jq -e --arg base_version "${base_version}" --arg next_version "${next_version}" \
            --arg release_branch "${RELEASE_BRANCH}" -f scripts/maintenance-release.jq <<<"${pr}"; then
            # A bot-created PR can have an approval-required pull_request run
            # even after dispatched head CI passes. Approve only this eligible
            # release head's CI using the native API, not arbitrary PR runs.
            pending_ci="$(gh run list --workflow ci.yml --commit "${head}" \
              --event pull_request --status action_required --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "${pending_ci}" ]]; then
              gh api --method POST "repos/${GH_REPO}/actions/runs/${pending_ci}/approve"
            fi
            # GitHub enforces the required checks and strict branch protection.
            gh pr merge "${number}" --auto --squash --match-head-commit "${head}"
          elif [[ "$(jq '.autoMergeRequest != null' <<<"${pr}")" == true ]]; then
            # A pending patch can become a minor release or be put on hold.
            gh pr merge "${number}" --disable-auto
          fi

          # GITHUB_TOKEN-created PR runs can require approval. Dispatch CI
          # explicitly, including recovery from an earlier failed dispatch.
          # Do not rerun unchanged heads every hour or retry failed tests.
          ci_runs="$(gh run list --workflow ci.yml --commit "${head}" \
            --event workflow_dispatch --limit 1 --json databaseId --jq 'length')"
          if [[ "${ci_runs}" == 0 ]]; then
            gh workflow run ci.yml --ref "${RELEASE_BRANCH}"
          fi

  release:
    name: Release binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # Fail early on a stable release without blocking routine release-PR
      # updates. GITHUB_TOKEN cannot write to another repository.
      - name: Check tap publishing credential
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "TAP_GITHUB_TOKEN must be available to this repository"
            exit 1
          fi
          if [[ "$(gh api repos/bluesky-social/homebrew-tap --jq '.permissions.push')" != true ]]; then
            echo "TAP_GITHUB_TOKEN must have write access to bluesky-social/homebrew-tap"
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
